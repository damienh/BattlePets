<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BattlePets</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    #frame { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; cursor: default; }
    #overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); text-align: center; padding: 16px;
    }
    #overlay button { font: bold 20px Arial, sans-serif; padding: 10px 28px; cursor: pointer; }
    #overlay.hidden { display: none; }
    #status { max-width: 520px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="screen" width="640" height="480"></canvas>
    <div id="overlay">
      <div id="status">Loading BattlePets...</div>
      <button id="start" hidden>Click to play</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
